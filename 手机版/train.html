<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 内容安全策略:与 index.html 同源同策略(本页同样读写 localStorage 里的 qg_ds_key)。
     script-src 不含 unsafe-eval;style-src 需 unsafe-inline —— 本页除自有 <style> 外,
     页脚"来源标记"三处色块是内联 style 属性。form-action 'none':本页 keyForm 的提交
     已被 train.js 的 submit 监听 preventDefault 接管,不存在真实提交。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.deepseek.com; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>穷观 · 破卷</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="穷观">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #05080f; --panel: rgba(10,16,30,.9); --panel-solid: rgba(8,12,24,.97);
    --border: rgba(120,160,220,.18); --text: #dbe6f5; --dim: #8fa3c0;
    --accent: #4fc3f7; --accent2: #ffd54f; --ok: #7ee2a8; --bad: #ff9d9d;
  }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    font-size: 14px; overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,160,220,.25); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(79,195,247,.4); }
  ::-webkit-scrollbar-track { background: transparent; }
  :focus-visible { outline: 2px solid rgba(79,195,247,.6); outline-offset: 1px; border-radius: 4px; }

  #top {
    flex: none;
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill {
    font-size: 12px; padding: 3px 10px; border-radius: 12px;
    border: 1px solid var(--border); background: rgba(120,160,220,.08);
    color: var(--dim); max-width: 46vw; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .pill b { color: var(--accent); font-weight: 600; }
  .pill.sel { border-color: rgba(79,195,247,.45); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type="text"], input[type="password"], select {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(10,16,30,.85); color: var(--text); font-size: 13px;
    outline: none; caret-color: var(--accent);
  }
  input:focus, select:focus { border-color: var(--accent); }
  #askInput { flex: 1; min-width: 220px; }
  button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(120,160,220,.12); color: var(--text); font-size: 13px;
    cursor: pointer; transition: filter .15s, transform .1s, background .15s;
  }
  button:hover { background: rgba(120,160,220,.22); }
  button:active { transform: scale(.97); }
  button.primary {
    background: linear-gradient(135deg, #2f80ed, #1e5bb8); color: #fff;
    border: 1px solid rgba(79,195,247,.5); font-weight: 600; letter-spacing: 1px;
    padding: 8px 20px;
  }
  button.primary:hover { filter: brightness(1.15); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.danger { border-color: rgba(255, 120, 120, 0.5); color: #ffb3b3; background: rgba(255, 90, 90, 0.08); }
  button.danger:hover { background: rgba(255, 90, 90, 0.2); }
  /* 允许换行:720×560(宿主最小尺寸)下本行原本被 body{overflow:hidden} 裁掉末尾按钮且无法滚动 */
  .key-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  /* 输入框改为弹性伸缩(原固定 width:300px 是右端被裁的主因) */
  .key-wrap input { flex: 1 1 auto; min-width: 150px; }
  /* 按钮/链接不参与收缩,保证「保存」「清除」「获取 Key ↗」永远完整可见可点 */
  .key-wrap button, .key-wrap a { flex: none; }
  .key-wrap a { color: var(--accent); text-decoration: none; }
  .key-wrap a:hover { text-decoration: underline; }
  #keyState.ok { color: var(--ok); } #keyState.bad { color: var(--bad); }

  main { flex: 1; overflow-y: auto; padding: 12px 16px 26px; }
  #statusRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #status { color: var(--dim); font-size: 12.5px; flex: 1; min-width: 200px; }
  #status.err { color: var(--bad); }
  #status.warn { color: var(--accent2); }
  #steps { color: var(--dim); font-size: 12px; }
  .spinner {
    display: inline-block; width: 12px; height: 12px; vertical-align: -1px;
    border: 2px solid rgba(79,195,247,.25); border-top-color: var(--accent);
    border-radius: 50%; margin-right: 6px; animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  #targetInfo { margin: 10px 0 4px; font-size: 12.5px; color: var(--dim); line-height: 1.7; }
  #targetInfo b { color: var(--accent); }
  #targetInfo .kw-tag {
    display: inline-block; margin: 2px 4px 0 0; padding: 1px 8px; font-size: 11.5px;
    border-radius: 10px; background: rgba(79,195,247,.1); border: 1px solid rgba(79,195,247,.25);
    color: var(--accent);
  }

  #qaArea { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
  .qcard {
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    background: var(--panel-solid); box-shadow: 0 6px 18px rgba(0,0,0,.3);
  }
  .q-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 14px; border-bottom: 1px solid var(--border);
    background: rgba(79,195,247,.05); font-size: 12.5px; color: var(--dim);
  }
  .q-n { color: #fff; font-weight: 700; }
  .q-type { color: var(--accent); }
  .q-diff { color: var(--accent2); }
  .q-src { color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
  .q-src.gk { color: var(--accent2); }
  .q-gk {
    padding: 1px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 700;
    color: #0a0f1a; background: linear-gradient(135deg, #ffd54f, #ffb300);
  }
  .q-web {
    padding: 1px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 700;
    color: #04121f; background: linear-gradient(135deg, #67e8f9, #22b8e6);
  }
  .q-mem {
    padding: 1px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 700;
    color: #12081f; background: linear-gradient(135deg, #d8b4fe, #a855f7);
  }
  .q-body { padding: 12px 16px; }
  .q-stem { font-size: 14px; line-height: 2; color: #e6eefb; }
  .q-opts { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .q-opts li { font-size: 13px; line-height: 1.8; color: #c6d4ea; padding: 2px 8px; border-radius: 6px; }
  .q-opts li:hover { background: rgba(120,160,220,.08); }
  .q-actions { display: flex; gap: 8px; padding: 0 16px 12px; }
  .q-actions button { font-size: 12px; padding: 5px 12px; }
  .sol { display: none; margin: 0 16px 14px; padding: 10px 12px; border-radius: 8px; background: rgba(10,16,30,.6); border-left: 3px solid var(--ok); }
  .sol.show { display: block; }
  .sol .a { color: var(--ok); font-weight: 700; margin-bottom: 4px; }
  .sol .an { color: #c6d4ea; font-size: 13px; line-height: 1.9; }
  .qcard mjx-container { max-width: 100%; overflow-x: auto; }

  .footnote { margin-top: 16px; font-size: 11.5px; color: #54647e; line-height: 1.8; }

  /* 板块定位结果 */
  #boardRes {
    margin: 10px 0 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(10,16,30,.5);
    overflow: hidden;
  }
  .br-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .br-head .ic { font-size: 15px; }
  .br-head .bd { color: var(--accent); font-weight: 700; }
  .br-head .kind {
    font-size: 10.5px; padding: 1px 6px; border-radius: 6px;
    color: var(--accent2); border: 1px solid rgba(255,213,79,.35);
  }
  .br-head .hit { margin-left: auto; color: var(--accent2); font-size: 12px; }
  .br-list { max-height: 240px; overflow-y: auto; padding: 4px 0; }
  .br-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; font-size: 12.5px; color: #c6d4ea;
    cursor: pointer; transition: background .12s;
  }
  .br-item:hover { background: rgba(79,195,247,.12); color: #fff; }
  .br-item.sel { background: rgba(79,195,247,.16); color: #fff; }
  .br-item .st { margin-left: auto; flex: none; color: var(--accent2); font-size: 11px; }
  /* 键盘焦点样式:br-item 是 <div class="br-item" data-idx> 且 train.js 只绑了 click,
     暂不加 tabindex/role(能聚焦但按 Enter 无响应体验更差),此处仅先备好视觉反馈 */
  .br-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* 无边框窗口:自绘控件(头部拖动由 train.js 的 pointerdown 提供,不依赖 Electron 的 app-region) */
  /* 自绘控件改为 .pills 内的普通 flex 项靠右停靠:原先绝对定位后,一旦 pills 换行
     就会压住第二行的 pill(720×560 下必然发生),改用 margin-left:auto 保持右对齐且永不覆盖 */
  .winctrl { flex: none; display: flex; gap: 6px; margin-left: auto; }
  .winctrl button {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 7px;
    background: rgba(120,160,220,.08); color: var(--dim); font-size: 13px; cursor: pointer;
    transition: all .2s;
  }
  .winctrl button:hover { color: #fff; border-color: rgba(79,195,247,.5); background: rgba(79,195,247,.14); }
  .winctrl button.wc-x:hover { border-color: rgba(255,120,120,.55); background: rgba(255,90,90,.18); }
  .winctrl button:active { transform: scale(.94); }

  /* 「← 返回知识云」:手机浏览器 / APK 里没有宿主窗口可关,这是最直接的出路。
     做成真 <a>,即使脚本异常也仍然可点、可跳。
     href 带 ?skip=1:跳过开场动画,落地即知识云主界面(与顶栏「⟳」重载同一约定),
     避免"退出破卷 → 又看一遍开场黑屏"被当成黑屏故障。 */
  #qgBack {
    flex: none; display: none;
    align-items: center; justify-content: center; gap: 4px;
    min-height: 44px; min-width: 44px; padding: 0 12px;
    border-radius: 9px; border: 1px solid rgba(79,195,247,.45);
    background: rgba(79,195,247,.12); color: var(--accent);
    font-size: 13px; font-weight: 600; text-decoration: none;
  }
  #qgBack:hover { background: rgba(79,195,247,.22); color: #fff; }

  /* 「破卷已结束」全屏遮罩(#qgClosed / .qg-closed-box / #qgBackHome)已整体删除:
     它正是"从破卷退出黑屏"的来源(整屏 rgba(5,8,15,.96) 近乎纯黑,
     唯一出路 history.back() 在 WebView 历史为空时退不回去)。
     手机端 ✕ / Esc 现在直接回知识云,不再需要、也不再存在这个遮罩。 */

  /* 无边框窗口:顶层灰色描边(覆盖层;最大化时直角) */
  .winedge {
    position: fixed; inset: 0;
    border: 1px solid rgba(148,158,175,.45);
    border-radius: 11px;
    pointer-events: none;
    z-index: 9500;
    box-sizing: border-box;
  }
  html.maxed .winedge { border-radius: 0; }

  /* ---------- 宿主最小窗(720×560)降级:顶栏三行在此尺寸下最紧张 ----------
     仅压缩间距与固定尺寸,不改变大窗下的观感;配合上面的 flex-wrap,
     确保「保存 / 清除 / 获取 Key ↗」与题型下拉都完整可见、可点、可滚。
     阈值取 max-height:620px(560 命中)与 max-width:800px(720 命中)双保险。 */
  @media (max-height: 620px), (max-width: 800px) {
    #top { gap: 6px; padding: 7px 10px; }
    .winctrl button { width: 44px; height: 44px; font-size: 15px; }
    .key-wrap { font-size: 11.5px; row-gap: 5px; }
    .key-wrap input { min-width: 120px; padding: 6px 9px; }
    #askInput { min-width: 150px; }
    .pill { max-width: 40vw; }
    main { padding: 8px 12px 18px; }
    .br-list { max-height: 170px; }
  }

  /* ============================================================
   * 移动端基础:动态视口高度 / 禁下拉刷新 / 安全区变量
   * (本页不引 css/style.css,所以基础变量在这里自己定义一份)
   * ============================================================ */
  html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  :root { --safe-t: 0px; --safe-b: 0px; }
  @supports (padding: env(safe-area-inset-top)) {
    :root {
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
  }

  /* ============================================================
   * 手机形态(≤768px):单列排布、触控热区 ≥44px、字号 ≥16px 防 iOS 放大
   * 宽屏(桌面破卷窗 720×560 起)不受影响。
   * ============================================================ */
  @media (max-width: 768px) {
    #top {
      gap: 6px;
      padding: calc(6px + var(--safe-t)) 10px 6px;
    }
    /* 手机上没有"窗口"可最小化/最大化,隐藏这两个;
       ✕ 保留 —— 它是用户最先会点的退出入口,热区必须 ≥44px。
       (原实现把整个 .winctrl 隐藏,等于手机上根本没有关闭/退出入口。) */
    #winMin, #winMax { display: none; }
    .winctrl button { width: 44px; height: 44px; font-size: 16px; border-radius: 10px; }
    /* 常驻「← 返回知识云」:APK / 浏览器里的主要退出路径(带 ?skip=1,落地即主界面) */
    #qgBack { display: inline-flex; }

    .pills { gap: 5px; }
    .pill { font-size: 11.5px; padding: 5px 10px; max-width: 100%; }

    .row { gap: 8px; }
    #askInput { min-width: 0; flex: 1 1 100%; min-height: 44px; font-size: 16px; padding: 10px 12px; }
    #locateBtn { flex: 1 1 auto; min-height: 44px; font-size: 14px; }
    #qType { flex: 1 1 auto; min-height: 44px; font-size: 14px; }

    .key-wrap { font-size: 12.5px; row-gap: 8px; }
    .key-wrap input { flex: 1 1 100%; min-width: 0; font-size: 16px; padding: 10px 12px; }
    .key-wrap button { min-height: 44px; padding: 0 16px; font-size: 13.5px; }
    .key-wrap a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; }

    main {
      padding: 10px 12px calc(26px + var(--safe-b));
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #statusRow { gap: 8px; }
    #genBtn { flex: 1 1 100%; min-height: 48px; font-size: 15px; }
    #qDiff { flex: 1 1 100%; min-height: 44px; font-size: 14px; }
    /* 素材偏好与难度独立成两个下拉:手机上也各占一行,保证 44px 触控热区 */
    #qSource { flex: 1 1 100%; min-height: 44px; font-size: 14px; }
    #status { min-width: 0; flex: 1 1 100%; font-size: 13px; }

    #targetInfo { font-size: 13px; }

    .q-head { gap: 8px; padding: 9px 12px; }
    .q-src { flex: 1 1 100%; max-width: 100%; white-space: normal; }
    .q-body { padding: 10px 12px; }
    .q-stem { font-size: 15px; line-height: 1.9; }
    .q-opts li {
      display: flex; align-items: center;
      min-height: 44px; padding: 8px; font-size: 14.5px; line-height: 1.7;
    }
    .q-actions { padding: 0 12px 12px; gap: 10px; }
    .q-actions button { min-height: 44px; padding: 0 14px; font-size: 13.5px; }
    .sol { margin: 0 12px 12px; padding: 10px 12px; }
    .sol .an { font-size: 14px; line-height: 1.85; }

    .br-head { flex-wrap: wrap; gap: 8px; }
    .br-head .hit { margin-left: 0; }
    .br-list { max-height: 42dvh; }
    .br-item { min-height: 46px; padding: 10px 12px; font-size: 13.5px; }

    .footnote { font-size: 11.5px; margin-top: 14px; }

    /* 输入控件字号统一抬到 16px:iOS Safari 在 <16px 时聚焦会自动放大页面 */
    input[type="text"], input[type="password"], select, textarea { font-size: 16px; }
  }
</style>
</head>
<body>

<header id="top">
  <div class="pills">
    <!-- 手机浏览器 / Capacitor APK 里没有"第二个窗口"可关,这是最直接的退出入口。
         ?skip=1:落地直接进知识云主界面,不重播开场动画。宽屏(桌面破卷窗)由 CSS 隐藏。 -->
    <a id="qgBack" href="index.html?skip=1" title="返回知识云" aria-label="返回知识云">← 返回知识云</a>
    <span class="pill" id="pSubject">科目:—</span>
    <span class="pill sel" id="pPoint">主系统当前:—</span>
    <span class="pill" id="pKw">搜索词:—</span>
    <div class="winctrl" id="winCtrl">
      <button type="button" id="winMin" title="最小化" aria-label="最小化">─</button>
      <button type="button" id="winMax" title="最大化 / 还原" aria-label="最大化">▢</button>
      <button type="button" id="winClose" class="wc-x" title="关闭" aria-label="关闭">✕</button>
    </div>
  </div>
  <div class="row">
    <input type="text" id="askInput" placeholder="输入板块 / 知识点,如:函数与导数、立体几何、词根 ject(当前科目内板块定位)">
    <button id="locateBtn">板块定位</button>
    <select id="qType" title="生成题型(每批固定 4 道,题型一致)">
      <option value="single" selected>单选题</option>
      <option value="multi">多选题</option>
      <option value="blank">填空题</option>
      <option value="essay">解答大题</option>
    </select>
  </div>
  <!-- 提交由 train.js 的 submit 监听 preventDefault 接管,action="javascript:void(0)"
       会被严格 CSP 的 script-src 拒绝,故直接去掉 action -->
  <!-- 穷观破卷 · 原创工程标识 QG-20260920-5e5d5a · 作者 PHILlA093 · 未经许可不得复制本页结构与脚本 -->
  <form class="key-wrap" id="keyForm">
    <span>DeepSeek API Key</span>
    <input type="password" id="keyInput" placeholder="sk-…(保存在本机,用于 AI 联网出题)" autocomplete="off">
    <button type="submit" id="saveKey">保存</button>
    <button type="button" id="clearKey" class="danger" title="一键删除本机保存的 Key 与运行记录,不留记录">🗑 清除</button>
    <span id="keyState"></span>
    <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">获取 Key ↗</a>
  </form>
</header>

<main>
  <div id="statusRow">
    <button id="genBtn" class="primary">🎯 出题训练</button>
    <select id="qDiff" title="题目难度,与素材来源独立">
      <option value="1">难度一 · 基础</option>
      <option value="2">难度二 · 巩固</option>
      <option value="3" selected>难度三 · 中档</option>
      <option value="4">难度四 · 综合</option>
      <option value="5">难度五 · 挑战</option>
    </select>
    <select id="qSource" title="优先采用的素材题数,不足时如实标记,不保证真题比例">
      <option value="0">AI 原创</option>
      <option value="2" selected>素材优先 · 目标2题</option>
