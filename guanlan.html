<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 内容安全策略:观澜独立窗与主窗同源,同样读写 localStorage 里的 qg_ds_key,故采用与
     index.html 完全一致的策略。本页有两段内联脚本(MathJax 配置 + 独立窗标记),均由
     script-src 的 'unsafe-inline' 放行;不含 unsafe-eval(MathJax 的 new Function /
     eval 在本页路径下不触发);connect-src 只放行 DeepSeek 官方接口。
     frame-ancestors 在 <meta> 形式下被浏览器强制忽略,故不写。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.deepseek.com; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穷观 · 观澜(AI 演示问答)</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #05080f; }
  body.gl-standalone { margin: 0; }
  .gl-standalone #guanlan {
    position: static;
    left: auto; top: auto;
    transform: none;
    width: 100vw;
    height: 100vh;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    animation: none;
    background: #05080f;
  }
  .gl-standalone #guanlan[hidden] { display: flex; }
  /* 独立窗标题栏同样由 demo.js 的 pointerdown 拖动(发 wnd/move 给宿主),
     故指针必须是 move,原来写 default 与真实手感矛盾。
     注:标题栏双击最大化需要 demo.js 补 dblclick→wnd('max'),本页 CSS 无法实现。 */
  .gl-standalone #glHead { cursor: move; }
  /* 顶层灰色描边 .winedge 与 html.maxed .winedge 已由 css/style.css 提供
     (本页 <link rel="stylesheet" href="css/style.css"> 已引入),此处不再逐字复制,
     避免同一规则两处定义漂移。 */
  /* 表达式列表 / 参数滑块栏(#glExprBox、#glParamBar 等)的样式不写在这里:
     观澜有两个入口(本独立页 与 index.html 的主窗面板),两者共用 js/demo.js,
     而 index.html 与 css/style.css 都不在可改清单里 —— 为保证两个入口观感一致,
     这部分样式由 demo.js 的 injectExprCSS() 注入一次(内联 <style>,CSP 的
     style-src 'unsafe-inline' 放行)。DOM 同样由 demo.js 动态插入 #glStage。 */
</style>
<script>
  window.__guanlanStandalone = true;   // 让 demo.js 以独立窗形态启动(隐藏标记、导入会话)
</script>
</head>
<body class="gl-standalone">

<div id="guanlan">
  <div class="gl-head" id="glHead" title="观澜 · AI 演示问答(独立窗口)">
    <span class="gl-title">🌊 观澜 · AI 演示问答</span>
    <span class="gl-sub" id="glCtx">—</span>
    <div class="gl-btns">
      <button type="button" id="glClearText" title="清空对话">清空对话</button>
      <button type="button" id="glMin" title="最小化">─</button>
      <button type="button" id="glMax" title="最大化 / 还原">▢</button>
      <button type="button" id="glClose" title="关闭窗口(关闭即清空对话)">✕</button>
    </div>
  </div>
  <div class="gl-body">
    <div class="gl-chat">
      <div id="glMsgs"></div>
      <!-- 提交由 demo.js 的 submit 监听 preventDefault 接管,故去掉 action="javascript:void(0)"
           (该写法会被严格 CSP 的 script-src 拒绝) -->
      <!-- 观澜画布 · 穷观原创标识 QG-20260920-5e5d5a · © 2026 PHILlA093 · All rights reserved -->
      <form id="glKeyRow" class="gl-keyrow" hidden>
        <input type="password" id="glKeyInput" placeholder="DeepSeek API Key(与破卷共用,仅存本机)" autocomplete="off">
        <button type="submit" id="glKeySave">保存</button>
      </form>
      <div class="gl-inputrow">
        <input type="text" id="glAsk" placeholder="提问 / 让 AI 讲解题目…">
        <button type="button" id="glSend">发送</button>
      </div>
    </div>
    <div class="gl-stage" id="glStage">
      <div class="gl-stage-tip" id="glStageTip">提问后点「🎬 动态演示」生成可动示意图(示例:将军饮马);也可在左上角表达式栏直接画:y = x^2、r = 2cos(3θ)</div>
      <div class="gl-toolbar" id="glToolbar" hidden>
        <button type="button" id="glDemoBtn" title="对最近的提问生成动态演示">🎬 动态演示</button>
        <span class="gl-sep"></span>
        <button type="button" id="glPlayBtn" title="播放">▶ 播放</button>
        <button type="button" id="glPauseBtn" title="暂停">⏸ 暂停</button>
        <button type="button" id="glStepBtn" title="步进一步">步进</button>
        <button type="button" id="glResetBtn" title="回到起点">重置</button>
        <span class="gl-sep"></span>
        <button type="button" id="glClearCanvasBtn" title="清空画布">清空画布</button>
        <span id="glDemoState" class="gl-state">画布:空</span>
      </div>
      <canvas id="glCanvas" width="900" height="600"></canvas>
      <div id="glLabels"></div>
    </div>
  </div>
</div>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']], displayMath: [['$$', '$$']],
      // 关键:禁用 autoload。默认开启时,遇到未内置的宏(如 \boldsymbol)会去懒加载
      // input/tex/extensions/xxx.js —— 本应用只内嵌了一个 mathjax-tex-svg.js,那个请求
      // 必然 404,而 typesetPromise 会因此整体 reject(还被 .catch 吞掉),结果是整张卡片
      // 的公式全部保持 $...$ 不排版(实测踩过:2026 真题里的 \boldsymbol{a})。
      // 关掉之后,最坏只影响那一个未知宏,同页其余公式照常渲染。
      autoload: false,
      // 常见的"扩展宏"给等价替身,让它们不再变成未知宏(粗体向量用内置 \mathbf 等价呈现)。
      macros: {
        boldsymbol: ['\\mathbf{#1}', 1],
        bm: ['\\mathbf{#1}', 1],
        cancel: ['#1', 1],
        bbox: ['#1', 1],
        unicode: ['#1', 1],
        textcolor: ['#2', 2],
        enclose: ['#2', 2],
        require: ['', 1]
      }
    },
    startup: { typeset: false }
  };
</script>
<script src="vendor/mathjax-tex-svg.js"></script>
<script src="js/glcanvas.js"></script>
<script src="js/gltemplates.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
